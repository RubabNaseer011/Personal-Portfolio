    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">My Portfolio</a>

        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>

                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
            <a href="contact.html" class="btn btn-primary ms-lg-3">Hire Me</a>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container text-center">
        <h1>Contact Me</h1>
        <p>Feel free to get in touch with me</p>
    </div>
</section>

<section class="section-padding">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="contact-card">

                    <h2 class="text-center mb-4">Get In Touch</h2>

                    <form id="contactForm">

                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control"
                            placeholder="Enter your name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control"
                            placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control"
                            placeholder="Enter subject" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5"
                            placeholder="Write your message" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Send Message
                        </button>

                    </form>

                    <div id="formMessage" class="mt-3 text-center"></div>

                </div>

            </div>

        </div>
    </div>
</section>

<footer>
    <p>© <span class="year"></span> My Portfolio. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
